# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: Python application

on:
    pull_request:
        branches: [ main ]

jobs:
    build:
        runs-on: ${{ matrix.os }}
        strategy:
            matrix:
                os: [ ubuntu-latest] # , macos-latest, windows-latest
                python-version: [ '3.11', '3.12', '3.13', '3.14' ]
        steps:
            -   uses: actions/checkout@v5
            -   name: Set up Python
                uses: actions/setup-python@v6
                with:
                    python-version: ${{ matrix.python-version }}
            -   name: Display Python version
                run: python --version
            -   name: Install dependencies
                run: |
                    python -m pip install --upgrade pip
                    pip install flake8 pytest
                    if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
                    if [ -f redis_streams_test/requirements_for_test.txt ]; then pip install -r redis_streams_test/requirements_for_test.txt; fi
            -   name: Lint
                run: |
                    flake8 redis_streams/
                    black redis_streams/
                    mypy --install-types --non-interactive redis_streams/
                    mypy --explicit-package-bases --namespace-packages redis_streams/
                    vulture --min-confidence 100 redis_streams/
            -   uses: actions/checkout@v5
            -   uses: shogo82148/actions-setup-redis@v1
                with:
                    redis-version: 'latest'
            -   run: redis-cli ping
            -   name: Test
                run: |
                    pytest --maxfail=5 --cov-report term --cov=redis_streams  --durations=10 --show-capture=stdout -vv -rP --random-order --html=pytest_report.html --self-contained-html redis_streams_test
                    coverage html
            -   uses: actions/upload-artifact@v5
                with:
                    name: Coverage-${{ matrix.python-version }}
                    path: ./htmlcov
            -   uses: actions/upload-artifact@v5
                with:
                    name: Pytest-Report-${{ matrix.python-version }}
                    path: pytest_report.html

    # Run the full suite against several real Redis server versions so that both
    # claiming code paths are exercised end-to-end:
    #   * 6.0          -> no XAUTOCLAIM, XPENDING + XCLAIM fallback path
    #   * 6.2          -> XAUTOCLAIM introduced (native path)
    #   * 7.4 / 8.6.1  -> modern servers (native path, deleted-PEL reply)
    redis-version-matrix:
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                redis-version: [ '6.0', '6.2', '7.4', '8.6.1' ]
        services:
            redis:
                image: redis:${{ matrix.redis-version }}
                ports:
                    - 6379:6379
                options: >-
                    --health-cmd "redis-cli ping"
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5
        steps:
            -   uses: actions/checkout@v5
            -   name: Set up Python
                uses: actions/setup-python@v6
                with:
                    python-version: '3.13'
            -   name: Install dependencies
                run: |
                    python -m pip install --upgrade pip
                    pip install pytest
                    if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
                    if [ -f redis_streams_test/requirements_for_test.txt ]; then pip install -r redis_streams_test/requirements_for_test.txt; fi
            -   name: Show Redis server version
                env:
                    REDIS_HOST: 127.0.0.1
                    REDIS_PORT: 6379
                run: |
                    python -c "import os, redis; print('redis_version:', redis.Redis(host=os.environ['REDIS_HOST'], port=int(os.environ['REDIS_PORT'])).info('server')['redis_version'])"
            -   name: Test claiming against Redis ${{ matrix.redis-version }}
                env:
                    REDIS_HOST: 127.0.0.1
                    REDIS_PORT: 6379
                run: |
                    pytest --maxfail=5 --durations=10 -vv -rP --random-order redis_streams_test

